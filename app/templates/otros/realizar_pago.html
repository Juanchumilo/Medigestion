<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="UTF-8">
        <title>Paciente ~ Realizar Pago - MediGestión</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon logo.png') }}">
    </head>

    
    <body>
        <!--Barra de navegación -->
        <div>
            <nav>
                <ul>
                    <li><a href="{{url_for('index')}}">Inicio</a></li>
                    <li><a href="{{url_for('ingresar')}}">Ingresar</a></li>
                    <li><a href="{{url_for('registrarse')}}">Registrarse</a></li>
                </ul>
            </nav>
        </div>


        <!--Menu de Usuario-->
        <header>
            <div class="logo-usuario">
                <a href="{{url_for('index')}}"><img src="{{ url_for('static', filename='img/medigestion logo_sf.png') }}" alt="Logo de MediGestión"></a>
                <div class="usuario-menu">
                    <span>Usuario: {{session['usuario']['nombre']}} {{session['usuario']['apellido']}}</span>
                    <select onchange="location = this.value;">
                        <option value="">Opciones</option>
                        <option value="/editar_datos/paciente/{{session['usuario']['id']}}">Editar mis datos</option>
                        <option value="/atencion_cliente">Atencion al Cliente</option>
                        <option value="{{ url_for('logout') }}">Cerrar sesión</option>
                    </select>
                </div>
            </div>
        </header>


        <!--Pago-->
        <section class="pago">
                <form action="{{ url_for('efectuarpago', id=session['usuario']['id']) }}" method="POST" id="formPago">
                <label for="nombre-titular">Nombre del Titular</label>
                <input id="nombre-titular" name="nombre-titular" type="text" required>

                <label for="num-tarjeta">Numero de Tarjeta</label>
                <input type="number" id="num-tarjeta" name="num-tarjeta" required>

                <label for="fecha-expiracion">Fecha de Expiracion</label>
                <input type="text" id="fecha-expiracion" name="fecha-expiracion" placeholder="MM/AA"maxlength="5"pattern="^(0[1-9]|1[0-2])\/\d{2}$" required>

                <label for="codigo-cvv">Codigo CVV</label>
                <input type="password" id="codigo-cvv" name="codigo-cvv" maxlength="3" required>

                <label for="email">Correo</label>
                <input id="correo" name="email" type="email" required>

                <label for="metodo-pago">Modo de Pago</label>
                <select name="metodo-pago">
                    <option>Tarjeta Crédito</option>
                    <option>Tarjeta Débito</option>
                    <option>PSE</option>
                </select>
            </form>
            <button type="submit" form="formPago">Realizar Pago</button>
        </section>
    </body>
    

    <!--Pie de pagina-->
    <footer>
        <p>&copy; 2024 MediGestión. Todos los derechos reservados.</p>
        <p>Juan Camilo Bernal</p>
    </footer>
</html>
