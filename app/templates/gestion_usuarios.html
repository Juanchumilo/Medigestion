<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="UTF-8">
        <title>Paciente ~ Cita - MediGestión</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/paciente_estilo.css') }}">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon logo.png') }}">
    </head>

    
    <body>
        <!--Barra de navegación -->
        <div>
            <nav>
                <ul>
                    <li><a href="{{url_for('index')}}">Inicio</a></li>
                    <li><a href="{{url_for('ingresar')}}">Ingresar</a></li>
                    <li><a href="{{url_for('registrarse')}}">Registrarse</a></li>
                </ul>
            </nav>
        </div>


        <!--Menu de Usuario-->
        <header>
            <div class="logo-usuario">
                <a href="{{url_for('index')}}"><img src="{{ url_for('static', filename='img/medigestion logo_sf.png') }}" alt="Logo de MediGestión"></a>
                <div class="usuario-menu">
                    <span>Usuario: {{session['usuario']['nombre']}} {{session['usuario']['apellido']}}</span>
                    <select onchange="location = this.value;">
                        <option value="">Opciones</option>
                        <option value="/editar_datos/paciente/{{session['usuario']['id']}}">Editar mis datos</option>
                        <option value="/atencion_cliente">Atencion al Cliente</option>
                        <option value="{{ url_for('logout') }}">Cerrar sesión</option>
                    </select>
                </div>
            </div>
        </header>


        <!--Gestión de Usuarios-->
        <section>
            <h2>Gestión de Usuarios</h2>
            <form>
                <label for="name">Nombre Completo:</label>
                <input type="text" id="in_name" name="Nombres" required>

                <label for="last_name">Apellidos:</label>
                <input type="text" id="in_last_name" name="Apellidos" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="in_email" name="Correo" required>

                <label for="password">Contraseña</label>
                <input type="password" id="in_password" name="Contraseña" required>

                <label for="role">Rol:</label>
                <select id="in_role" name="Rol" required>
                    <option value="admin">Administrador</option>
                    <option value="medico">Médico</option>
                    <option value="paciente">Paciente</option>
                </select>
                <label for="nacimiento">Fecha de Nacimiento</label>
                <input type="date" id="in_birthdate" name="Fecha de Nacimiento" required min="1900-01-01" max="2026-01-01">

                <label for="phone">Teléfono:</label>
                <input type="tel" id="in_phone" name="Teléfono" required pattern="[0-9]{10}">
            
                <label for="age">Edad</label>
                <input type="number" id="in_age" name="Edad" required min="0" max="120">

                <div class="btns">
                    <button type="submit">Agregar Usuario</button>
                    <button type="button">Eliminar Usuario</button>
                    <button type="button">Modificar Usuario</button>
                </div>
                <div class="divclean">
                    <button type="reset" id="clean">Limpiar</button>
                </div>
            </form>
        </section>
    </body>

    <!--Pie de pagina-->
    <footer>
        <p>&copy; 2024 MediGestión. Todos los derechos reservados.</p> 
        <p>Juan Camilo Bernal</p>
    </footer>
</html>
