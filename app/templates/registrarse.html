<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registrarse - MediGestión</title>
        <link rel="stylesheet" href="{{url_for('static',filename='css/registrarse_estilo.css')}}">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon logo.png') }}">
    </head>

    
    <body>
        <!--Barra de Navegacion-->
        <div class="logo-nav">
            <a href="{{url_for('index')}}"><img src="{{url_for('static',filename='img/medigestion logo_sf.png')}}" alt="Logo de MediGestión" title="Logo de MediGestión" id="medilogo"></a>
                <ul>
                    <li><a href="{{url_for('index')}}">Inicio</a></li>
                    <li><a href="{{url_for('ingresar')}}">Ingresar</a></li>
                    <li><a href="{{url_for('registrarse')}}">Registrarse</a></li>
                </ul>
        </div>


        <!--Form para registrarse al sistema-->
        <main>
            <div class="register-container">
                <h1>Indica tus datos para registrarte</h1>
                <form>
                    <label for="name">Nombres</label>
                    <input type="text" id="name" placeholder="Nombre" required name="name" minlength="3">
                    
                    <label for="last_name">Apellidos</label>
                    <input type="text" id="last_name" placeholder="Apellidos" required name="last_name" minlength="3">

                    <label for="email">Correo</label>
                    <input type="email" id="email" placeholder="Correo" required name="email">

                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña" required name="password">

                    <label for="confirm_password">Confirmar contraseña</label>
                    <input type="password" id="confirm_password" placeholder="Confirmar contraseña" required>

                    <label for="birthdate">Fecha de nacimiento</label>
                    <input type="date" id="birthdate" required name="birthdate" max="2025-03-11" min="1900-01-01">

                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" placeholder="Teléfono" required name="phone" pattern="[0-9]{10}">

                    <label for="tipo-documento">Tipo de Documento</label>
                    <select name="tipo-documento" id="tipo-documento" required>
                        <option value="Cédula de Ciudadanía">Cédula de Ciudadanía</option>
                        <option value="Tarjeta de identidad">Tarjeta de identidad</option>
                        <option value="Cédula de extranjería">Cédula de extranjería</option>
                    </select>

                    <label for="documento">Documento</label>
                    <input type="text" id="documento" placeholder="Documento" required name="documento" pattern="[0-9]{6,10}">

                    <label for="rh">Tipo de RH</label>
                    <select name="rh" id="rh" required>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>

                    <label for="genero">Género</label>
                    <select name="genero" id="genero" required>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option> 
                    </select>

                    <label>
                        <input type="checkbox" required name="terminos"> Acepto los términos y condiciones
                    </label>

                    <button type="submit">Registrarse</button>
                </form>
                </div>
        </main>


        <!--Botones adicionales-->
        <div class="login-link">
                    <h3>¿Ya tienes una cuenta?</h3>
                    <a href="ingresar.html" class="log-link">Iniciar Sesión</a>
                    <a href="forgotpassword.html" class="forgot-link">Olvidé mi contraseña</a>
        </div>
        <div class="info-text">
            <h3>Al crear una cuenta podrás gestionar todas tus citas y reportes. ¿Qué esperas?</h3>
        </div>
    </body>


    <!--Pie de Pagina-->
    <footer>
        <p>© 2024 MediGestión. Todos los derechos reservados.</p>  
        <p>Juan Camilo Bernal Baquero</p>
    </footer>
</html>
